
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ESP32-WiFi-Hash-Monster
default_envs = m5stack-core2
;default_envs = m5stack-fire
;default_envs = m5stack-core-esp32
;default_envs = odroid_esp32

[env]
; Chimera 1.5.2 selects the legacy I2S API only through Arduino-ESP32 2.0.14.
; Pin a released platform and framework instead of the obsolete upstream branch.
platform = espressif32@6.5.0
platform_packages = platformio/framework-arduinoespressif32@3.20014.231204
framework = arduino
; Export the renamed-miniz compatibility header to dependency compilation too.
build_flags = -I"${PROJECT_DIR}/include"
upload_speed = 921600
monitor_speed = 115200
; deep needed in order to pick up SD.h dependency of M5Stack-SD-Updater
lib_ldf_mode = deep
lib_compat_mode = strict
; lib_extra_dirs = ~/Documents/Arduino/libraries/
lib_deps =
  Wire
  SPI
  FS
  SPIFFS
  SD
  HTTPClient
  WiFi
  WiFiClientSecure
  Update
  Preferences
  LovyanGFX@1.2.35
  ESP32-Chimera-Core@1.5.2
  M5Stack-SD-Updater@1.2.8
  ESP32-targz@1.3.1

[env:m5stack-fire]
board = m5stack-fire
lib_deps =
  ${env.lib_deps}
  FastLED@3.4.0

[env:m5stack-core-esp32]
board = m5stack-core-esp32
lib_deps =
  ${env.lib_deps}
lib_ignore =
  M5Stack

[env:m5stack-core2]
board = m5stack-core2
lib_deps =
  ${env.lib_deps}
# Chimera supplies the M5 API and display driver; the stock M5Core2 library
# is intentionally excluded to avoid duplicate M5 symbols.
lib_ignore =
  M5Core2

[env:odroid_esp32]
board = odroid_esp32
lib_deps =
  ${env.lib_deps}
